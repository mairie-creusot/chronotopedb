name: Docker

# Publie ghcr.io/mairie-creusot/chronotopedb (chronotope-server, voir
# Dockerfile). Meme patron que docker-pawchat.yml du fork SpacetimeDB de
# PawChat : push sur main touchant le code, ou declenchement manuel.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag supplementaire a publier en plus de latest/sha-*"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          tags="ghcr.io/mairie-creusot/chronotopedb:latest
          ghcr.io/mairie-creusot/chronotopedb:sha-${GITHUB_SHA::12}"
          if [ -n "${{ inputs.tag }}" ]; then
            tags="$tags
          ghcr.io/mairie-creusot/chronotopedb:${{ inputs.tag }}"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Voir mairie-creusot/SpacetimeDB PAWCHAT.md pour le piege deja vecu :
      # un package existant pousse a la main peut avoir une liaison cassee
      # au depot meme si "Manage Actions access" l'affiche en Admin — dans
      # ce cas, supprimer le package puis relancer ce workflow le relie
      # correctement (mais supprime aussi tous ses tags existants).
      - name: Rappel visibilite du package
        run: |
          echo "::notice::Si c'est la premiere publication, passe le package chronotopedb en Public depuis ses parametres GitHub (GITHUB_TOKEN ne peut pas le faire automatiquement)."

  size-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pull et verifie la taille de l'image
        run: |
          docker pull ghcr.io/mairie-creusot/chronotopedb:sha-${GITHUB_SHA::12}
          size_bytes=$(docker inspect ghcr.io/mairie-creusot/chronotopedb:sha-${GITHUB_SHA::12} --format='{{.Size}}')
          size_mb=$((size_bytes / 1024 / 1024))
          echo "Taille de l'image : ${size_mb} Mo"
          if [ "$size_mb" -gt 80 ]; then
            echo "::error::Image de ${size_mb} Mo — depasse le budget de 80 Mo fixe pour ce projet."
            exit 1
          fi
