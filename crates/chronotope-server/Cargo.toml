[package]
name = "chronotope-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Binaire d'integration : expose ChronotopeStore en HTTP/WebSocket pour des tests reels (docker-compose), en dehors du perimetre de mesure H1-H4."

[[bin]]
name = "chronotope-server"
path = "src/main.rs"

[dependencies]
chronotope-core.workspace = true
chronotope-directory.workspace = true
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Comparaison a temps constant du secret partage (voir main.rs::secret_valide) —
# une seule dependance pure Rust, pas de code natif, pour ne pas alourdir
# l'image (ecarte `ring` pour la meme raison que l'absence de ca-certificates).
subtle = "2.6"
# Deplace depuis [dev-dependencies] : concurrency_limit/load_shed (voir
# main.rs::router) sont maintenant utilises par le binaire, pas seulement
# par les tests. Deja une dependance transitive d'axum — aucune nouvelle
# dependance de fond.
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
