<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="320" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0f172a">Coherence par horizon scelle — un chronotope bascule d'etat une seule fois</text>
  <text x="24" y="54" font-size="12" fill="#64748b">Horizon::default() = 100 ms (2 ticks a 20 Hz) — reutilise le delai d'interpolation deja subi cote client, jamais un budget reseau invente.</text>

  <!-- timeline base -->
  <line x1="80" y1="200" x2="860" y2="200" stroke="#cbd5e1" stroke-width="2"/>

  <!-- open region -->
  <rect x="180" y="150" width="260" height="100" fill="#fef9c3" opacity="0.6"/>
  <text x="200" y="140" font-size="12" font-weight="700" fill="#854d0e">OUVERT — Etat::Ouvert</text>
  <text x="200" y="176" font-size="11" fill="#713f12">plusieurs ecrire() possibles</text>
  <text x="200" y="192" font-size="11" fill="#713f12">CRDT degenere : LWW par EntityId</text>
  <text x="200" y="208" font-size="11" fill="#713f12">(cardinalite 1 -&gt; dernier ecrivain gagne,</text>
  <text x="200" y="224" font-size="11" fill="#713f12">correct par construction, pas un compromis)</text>

  <!-- sealed region -->
  <rect x="440" y="150" width="380" height="100" fill="#ecfdf5" opacity="0.7"/>
  <text x="460" y="140" font-size="12" font-weight="700" fill="#065f46">SCELLE — Etat::Scelle</text>
  <text x="460" y="176" font-size="11" fill="#064e3b">sceller() idempotent (memes octets rejoues)</text>
  <text x="460" y="192" font-size="11" fill="#064e3b">journal immuable, event-sourced</text>
  <text x="460" y="208" font-size="11" fill="#064e3b">toute ecrire() ulterieure -&gt; WriteError::AlreadySealed</text>
  <text x="460" y="224" font-size="11" fill="#064e3b">observer() ne pousse que du scelle (jamais du speculatif)</text>

  <!-- markers -->
  <circle cx="180" cy="200" r="5" fill="#0f172a"/>
  <text x="180" y="270" font-size="12" font-family="Consolas,Menlo,monospace" fill="#0f172a" text-anchor="middle">tick T</text>
  <text x="180" y="288" font-size="10" fill="#94a3b8" text-anchor="middle">recycler(T) — Etat::Ouvert</text>

  <circle cx="440" cy="200" r="5" fill="#0f172a"/>
  <text x="440" y="270" font-size="12" font-family="Consolas,Menlo,monospace" fill="#0f172a" text-anchor="middle">T + Δ</text>
  <text x="440" y="288" font-size="10" fill="#94a3b8" text-anchor="middle">sceller(T) — bascule une seule fois</text>

  <!-- delta bracket -->
  <path d="M180,120 L180,112 L440,112 L440,120" stroke="#334155" stroke-width="1" fill="none"/>
  <text x="310" y="104" font-size="11" fill="#334155" text-anchor="middle">Δ = horizon (100 ms par defaut)</text>

  <!-- ring retention note -->
  <path d="M820,200 L860,200" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="820" y="270" font-size="11" fill="#64748b" text-anchor="end">anneau : 64 ticks retenus par cellule</text>
  <text x="820" y="286" font-size="10" fill="#94a3b8" text-anchor="end">(hierarchie memoire T0 — au-dela, recycle)</text>
</svg>
